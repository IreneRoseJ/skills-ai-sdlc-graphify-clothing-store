name: Step 2 # AI assistant integration

# Checks Step 2: learner committed a Graphify integration for Cursor, Claude, and/or Copilot
# Then posts Step 3 on the exercise issue and enables the next workflow.

on:
  push:
    branches:
      - main
    # AGENTS.md already exists in this repo — including it would run Step 2 on
    # the initial push. For AGENTS.md-only work, push then Run workflow.
    paths:
      - ".cursor/rules/graphify.mdc"
      - "CLAUDE.md"
      - ".github/copilot-instructions.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

env:
  STEP_3_FILE: ".github/steps/3-add-graphifyignore.md"

jobs:
  find_exercise:
    name: Find Exercise Issue
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.7.0

  check_step_work:
    name: Check step work
    runs-on: ubuntu-latest
    needs: find_exercise
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get response templates
        uses: actions/checkout@v4
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.7.0

      - name: Find last comment
        id: find-last-comment
        uses: peter-evans/find-comment@v3
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          direction: last

      - name: Update comment - checking work
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          file: exercise-toolkit/markdown-templates/step-feedback/checking-work.md
          edit-mode: replace

      - name: Check AI assistant Graphify integration
        id: check-assistant-integration
        continue-on-error: true
        run: |
          set -euo pipefail
          found=""
          if [ -f .cursor/rules/graphify.mdc ] && [ -s .cursor/rules/graphify.mdc ]; then
            found="Cursor (.cursor/rules/graphify.mdc)"
          elif [ -f CLAUDE.md ] && grep -qi 'graphify' CLAUDE.md; then
            found="Claude Code (CLAUDE.md)"
          elif [ -f AGENTS.md ] && grep -qi 'graphify' AGENTS.md; then
            found="AGENTS.md (Copilot / Codex / multi-assistant)"
          elif [ -f .github/copilot-instructions.md ] && grep -qi 'graphify' .github/copilot-instructions.md; then
            found="GitHub Copilot (.github/copilot-instructions.md)"
          fi
          if [ -z "$found" ]; then
            echo "No Graphify assistant integration file found"
            exit 1
          fi
          echo "STEP_MESSAGE=${found}" >> "$GITHUB_OUTPUT"

      - name: Update comment - step results
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          file: exercise-toolkit/markdown-templates/step-feedback/step-results-table.md
          edit-mode: replace
          vars: |
            step_number: 2
            results_table:
              - description: ${{ steps.check-assistant-integration.outputs.STEP_MESSAGE || 'AI assistant Graphify integration exists' }}
                passed: ${{ steps.check-assistant-integration.outcome == 'success' }}

      - name: Fail job if checks failed
        if: steps.check-assistant-integration.outcome == 'failure'
        run: exit 1

  post_next_step_content:
    name: Post next step content
    needs: [find_exercise, check_step_work]
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get response templates
        uses: actions/checkout@v4
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.7.0

      - name: Create comment - step finished
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/step-finished-prepare-next-step.md
          vars: |
            next_step_number: 3

      - name: Create comment - add step content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.STEP_3_FILE }}

      - name: Create comment - watching for progress
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/watching-for-progress.md

      - name: Disable current workflow and enable next one
        run: |
          gh workflow disable "2-ai-assistant-integration.yml" || true
          gh workflow enable "3-add-graphifyignore.yml"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
