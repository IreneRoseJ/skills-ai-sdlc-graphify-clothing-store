name: Step 0 # Start Exercise

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # Update Readme
  actions: write # Disable/enable workflows
  issues: write # Create issue and comment on issues

env:
  STEP_1_FILE: ".github/steps/1-install-graphify-cli.md"

jobs:
  start_exercise:
    if: |
      !github.event.repository.is_template
    name: Start Exercise
    uses: skills/exercise-toolkit/.github/workflows/start-exercise.yml@v0.8.1
    with:
      exercise-title: "AI SDLC Skills"
      intro-message: "If you are new to GitHub, you might find your fellow developers use ___**issues**___ to organize their work and collaborate. We will do the same while you practice an AI SDLC workflow. Set up this clothing store, then use Graphify so your AI assistant understands the codebase!"

  post_next_step_content:
    name: Post next step content
    runs-on: ubuntu-latest
    needs: [start_exercise]
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.start_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Get response templates
        uses: actions/checkout@v4
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.7.0

      - name: Create comment - add step content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.STEP_1_FILE }}

      - name: Create comment - watching for progress
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/watching-for-progress.md

      # Later steps path-filter files that already exist (AGENTS.md, Cart.jsx,
      # package.json, …). Keep them disabled until Step 1 unlocks the chain.
      # Token-opt (7–10) stays off until Step 6 posts Step 8 on the same issue.
      - name: Disable later steps; enable Step 1 only
        run: |
          for wf in \
            0-start-exercise.yml \
            1-install-graphify-cli.yml \
            2-ai-assistant-integration.yml \
            3-add-graphifyignore.yml \
            4-build-first-graph.yml \
            5-draft-tests.yml \
            6-implement-feature.yml \
            7-token-opt-start.yml \
            8-token-opt-exclude-noise.yml \
            9-token-opt-context-engineering.yml \
            10-token-opt-reading-guide.yml
          do
            gh workflow disable "$wf" || true
          done
          gh workflow enable "1-install-graphify-cli.yml"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
